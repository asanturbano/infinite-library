<script type="module">
import * as THREE from 'three';

/* ============================================================
   THE INFINITE LIBRARY — Salle Ovale, BnF Richelieu
   One fixed oval room; the camera travels a closed elliptical
   path so the loop is seamless by construction.
   ============================================================ */

// ---------- deterministic RNG ----------
function hash(...ns){ let h=2166136261>>>0;
  for(const x of ns){ h^=Math.imul(x|0,374761393); h=Math.imul(h,668265263); h^=h>>>15; }
  return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- room constants ----------
const A=22, B=16.5;                 // wall semi-axes (44 x 33 m)
const BAYS=16;
const OFF_FACE=0.55;                // shelf front face, inward from wall
const OFF_PATH=2.05;                // camera path, inward from wall
const EYE=1.65;

const G_PLINTH=0.22;
const G_PITCH=[0.60,0.56,0.54,0.52,0.50,0.48,0.46];  // 7 ground rows
const G_TOP = G_PLINTH + G_PITCH.reduce((a,b)=>a+b,0);   // 3.88
const G_CORNICE=0.45;                                    // case top 4.33
const LVLS=[4.5, 6.9, 9.3];         // gallery walkway floor heights
const L_PLINTH=0.10;
const L_PITCH=[0.46,0.44,0.42,0.40];                     // 4 rows / gallery
const L_TOP = L_PLINTH + L_PITCH.reduce((a,b)=>a+b,0);   // 1.82
const L_BAND=0.16;                                       // gallery case ~1.98
const WALL_Y0=11.35, WALL_Y1=16.95; // upper (arch + oculus) wall band
const BOARD=0.035;

// ---------- ellipse geometry / arc-length table ----------
function basePt(t, d, y, out){
  const c=Math.cos(t), s=Math.sin(t);
  let nx=c/A, nz=-s/B; const nl=Math.hypot(nx,nz); nx/=nl; nz/=nl;
  out = out || new THREE.Vector3();
  out.set(A*c - nx*d, y||0, -B*s - nz*d);
  return out;
}
const SAMP=4096;
const arcT=new Float64Array(SAMP+1), arcS=new Float64Array(SAMP+1);
let L=0;
{
  const p=new THREE.Vector3(), q=new THREE.Vector3();
  basePt(0,OFF_FACE,0,p);
  for(let i=1;i<=SAMP;i++){
    const t=i/SAMP*Math.PI*2;
    basePt(t,OFF_FACE,0,q);
    L += Math.hypot(q.x-p.x,q.z-p.z);
    arcT[i]=t; arcS[i]=L; p.copy(q);
  }
}
const BAYW=L/BAYS;
function tOf(s){
  s=((s%L)+L)%L;
  let lo=0, hi=SAMP;
  while(hi-lo>1){ const m=(lo+hi)>>1; (arcS[m]<s)?(lo=m):(hi=m); }
  const f=(s-arcS[lo])/((arcS[hi]-arcS[lo])||1);
  return arcT[lo]+(arcT[hi]-arcT[lo])*f;
}
function ptAt(s,d,y,out){ return basePt(tOf(s),d,y,out); }

// ---------- palette ----------
// weighted book palette: accumulated, not art-directed
const PAL=[];
function padd(hex,w){ const r=(hex>>16)&255,g=(hex>>8)&255,b=hex&255;
  for(let i=0;i<w;i++) PAL.push([r,g,b]); }
padd(0x6d2331,5); padd(0x58252a,4); padd(0x7a352f,4); padd(0x8f4034,3);
padd(0x2f4636,4); padd(0x3a5244,3); padd(0x26382c,3);
padd(0x2c3a52,3); padd(0x243247,3); padd(0x1f2a3a,2);
padd(0x5b4632,5); padd(0x6e5638,4); padd(0x46332a,4); padd(0x33302c,4);
padd(0x272524,3); padd(0x1e1c1a,2);
padd(0xcfc2a4,2); padd(0xbfae8c,2); padd(0xa8823f,2); padd(0x94683a,3);
padd(0x845c74,1); padd(0x486b74,1); padd(0x9c5a28,1); padd(0x6a3b52,1);

function lum(c){ return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255; }
function css(c,a){ return a===undefined?`rgb(${c[0]},${c[1]},${c[2]})`:`rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(c,f){ return [Math.min(255,c[0]*f)|0, Math.min(255,c[1]*f)|0, Math.min(255,c[2]*f)|0]; }

// ---------- fictional titles ----------
const T_DE=["Histoire","Mémoires","Chroniques","Annales","Précis","Éléments","Dictionnaire","Atlas","Grammaire","Antiquités","Cartulaire","Description"];
const T_SUR=["Essai","Discours","Études","Recherches","Considérations","Observations","Lettres","Traité","Notes"];
const T_SOLO=["Poésies","Œuvres choisies","Correspondance","Fables nouvelles","Herbier général","Voyage en Orient","Théâtre complet","Sermons","Chansonnier","Bestiaire"];
const S_DE=["de la Loire","de l'Anjou","des Alpes","de la Botanique","de l'Astronomie","de Rome","de Byzance","de la Normandie","de la Musique","de Venise","de la Provence","de l'Égypte","de la Toscane","du Levant","de la Bourgogne","des Flandres","de la Perse","de l'Andalousie","de la Champagne","de la Baltique","des Cévennes","de la Sologne","de l'Arménie","du Roussillon","des Monnaies","des Cathédrales","de la Sarthe","du Piémont"];
const S_SUR=["sur la Lumière","sur les Monnaies","sur l'Architecture","sur la Flore","sur les Éclipses","sur la Peinture","sur les Fossiles","sur la Navigation","sur la Mémoire","sur les Volcans","sur la Perspective","sur les Abeilles","sur le Commerce","sur les Songes"];
const AUTH=["A. Mercier","P. Delorme","J. Aubert","H. Blanchard","L. Chastel","E. Fabre","M. Garnier","C. Lacombe","R. Marchand","V. Perrin","G. Roussel","N. Tessier","F. Corbin","B. Estève","T. Vigné","S. Halévy","D. Kowalski","I. Moretti","K. Lindqvist","O. Brandt"];
const ROMAN=["I","II","III","IV","V","VI","VII","VIII"];
function pick(rng,arr){ return arr[(rng()*arr.length)|0]; }
function makeTitle(rng){
  const r=rng();
  if(r<0.42) return pick(rng,T_DE)+" "+pick(rng,S_DE);
  if(r<0.75) return pick(rng,T_SUR)+" "+pick(rng,S_SUR);
  return pick(rng,T_SOLO);
}

// ============================================================
// CANVAS TEXTURES
// ============================================================
function canvasTex(w,h,draw,opts){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  if(opts&&opts.repeat){ t.wrapS=THREE.RepeatWrapping; t.wrapT=THREE.RepeatWrapping; }
  t.anisotropy=8;
  return t;
}

// ---- book spine atlas: 128 designs (32x4 tiles of 64x448) + paper/cloth bands ----
const DESIGNS=[];
const atlasTex=canvasTex(2048,2048,(ctx)=>{
  const rng=mulberry32(hash(101));
  ctx.fillStyle='#221c16'; ctx.fillRect(0,0,2048,2048);
  const TW=64, TH=448;
  for(let row=0;row<4;row++) for(let col=0;col<32;col++){
    const x=col*TW, y=row*TH;
    const base=pick(rng,PAL);
    const light=lum(base)>0.5;
    // base + subtle vertical gradient
    const g=ctx.createLinearGradient(x,0,x+TW,0);
    g.addColorStop(0,css(shade(base,1.18))); g.addColorStop(0.25,css(base));
    g.addColorStop(0.8,css(base)); g.addColorStop(1,css(shade(base,0.62)));
    ctx.fillStyle=g; ctx.fillRect(x,y,TW,TH);
    // cloth mottling
    for(let i=0;i<14;i++){
      ctx.fillStyle=`rgba(${rng()<0.5?'0,0,0':'255,255,255'},${(0.02+rng()*0.05).toFixed(3)})`;
      const sx=x+rng()*TW; ctx.fillRect(sx,y,1+rng()*4,TH);
    }
    for(let i=0;i<9;i++){
      ctx.fillStyle=`rgba(0,0,0,${(0.02+rng()*0.04).toFixed(3)})`;
      const sy=y+rng()*TH; ctx.fillRect(x,sy,TW,1+rng()*5);
    }
    // hard side darkening (rounded spine)
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(x,y,2,TH); ctx.fillRect(x+TW-3,y,3,TH);
    ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(x+3,y,2,TH);
    // style roll
    const gilt=`rgba(201,166,88,${light?0.85:0.8})`;
    const style=rng();
    if(style<0.38){ // raised leather bands
      const nb=4+((rng()*3)|0);
      for(let b=0;b<nb;b++){
        const by=y+TH*(0.14+0.72*b/(nb-1));
        ctx.fillStyle='rgba(0,0,0,0.32)'; ctx.fillRect(x+3,by,TW-6,4);
        ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(x+3,by+4,TW-6,2);
        if(rng()<0.6){ ctx.fillStyle=gilt; ctx.fillRect(x+6,by-3,TW-12,1); }
      }
    } else if(style<0.72){ // gilt double rules
      for(const fy of [0.055,0.085,0.86,0.9]){
        ctx.fillStyle=gilt; ctx.fillRect(x+6,y+TH*fy,TW-12,1.5);
      }
    } else if(style<0.88){ // dark title panel
      ctx.fillStyle=css(shade(base,0.45));
      ctx.fillRect(x+5,y+TH*0.08,TW-10,TH*0.2);
      ctx.strokeStyle=gilt; ctx.lineWidth=1;
      ctx.strokeRect(x+7.5,y+TH*0.095,TW-15,TH*0.17);
    }
    // paper label near bottom (some)
    if(rng()<0.2){
      ctx.fillStyle='rgba(226,214,183,0.92)';
      ctx.fillRect(x+14,y+TH*0.9,TW-28,TH*0.055);
      ctx.strokeStyle='rgba(60,45,30,0.5)'; ctx.lineWidth=1;
      ctx.strokeRect(x+15,y+TH*0.905,TW-30,TH*0.045);
      ctx.fillStyle='rgba(60,45,30,0.7)'; ctx.font='10px Georgia'; ctx.textAlign='center';
      ctx.fillText(String(100+((rng()*899)|0)), x+TW/2, y+TH*0.938);
      ctx.textAlign='left';
    }
    // lettering (rotated 90° cw, reads top→bottom)
    const dark=lum(base)>0.55;
    const tcol = dark ? 'rgba(96,70,44,0.75)' : (rng()<0.72?gilt:'rgba(232,220,192,0.85)');
    const title=makeTitle(rng);
    ctx.save();
    ctx.translate(x+TW/2, y+TH*0.13);
    ctx.rotate(Math.PI/2);
    ctx.fillStyle=tcol;
    let fs=17;
    ctx.font=`600 ${fs}px Georgia`;
    while(ctx.measureText(title).width > TH*0.58 && fs>10){ fs--; ctx.font=`600 ${fs}px Georgia`; }
    ctx.fillText(title, 0, 5);
    if(rng()<0.75){
      ctx.font='italic 12px Georgia';
      ctx.fillText(pick(rng,AUTH), TH*0.62, 4);
    }
    if(rng()<0.4){
      ctx.font='11px Georgia';
      ctx.fillText('T. '+pick(rng,ROMAN), TH*0.8, 4);
    }
    ctx.restore();
    // head/tail: soft shadow fades instead of hard caps (reads as shelf shadow at grazing angles)
    let hg=ctx.createLinearGradient(0,y,0,y+16);
    hg.addColorStop(0,'rgba(20,12,6,0.5)'); hg.addColorStop(1,'rgba(20,12,6,0)');
    ctx.fillStyle=hg; ctx.fillRect(x,y,TW,16);
    hg=ctx.createLinearGradient(0,y+TH-10,0,y+TH);
    hg.addColorStop(0,'rgba(20,12,6,0)'); hg.addColorStop(1,'rgba(20,12,6,0.4)');
    ctx.fillStyle=hg; ctx.fillRect(x,y+TH-10,TW,10);
    DESIGNS.push({
      u0:(x+3)/2048, u1:(x+TW-4)/2048,
      v1:1-(y+3)/2048, v0:1-(y+TH-3)/2048,
      col:[base[0]/255, base[1]/255, base[2]/255]
    });
  }
  // paper band (top edges of pages): y 1792..2048, x 0..1024
  ctx.fillStyle='#e6dbc1'; ctx.fillRect(0,1792,1024,256);
  for(let i=0;i<86;i++){
    ctx.fillStyle=`rgba(150,130,95,${0.12+((i*7)%10)*0.02})`;
    ctx.fillRect(0,1795+i*3,1024,1);
  }
  for(let i=0;i<60;i++){
    ctx.fillStyle='rgba(120,100,70,0.08)';
    ctx.fillRect((i*97)%1024,1792,2,256);
  }
  // cloth band (white base — tinted by vertex colour): x 1024..2048
  ctx.fillStyle='#f3f1ec'; ctx.fillRect(1024,1792,1024,256);
  for(let i=0;i<300;i++){
    ctx.fillStyle=`rgba(0,0,0,${0.012+((i*13)%9)*0.003})`;
    ctx.fillRect(1024+((i*53)%1024),1792,1,256);
  }
  for(let i=0;i<80;i++){
    ctx.fillStyle='rgba(0,0,0,0.018)';
    ctx.fillRect(1024,1792+((i*29)%256),1024,1);
  }
});
function paperUV(rng){
  const x0=3+rng()*(1024-56);
  return {u0:x0/2048,u1:(x0+44)/2048, v0:1-2042/2048, v1:1-1798/2048};
}
function clothUV(rng){
  const x0=1030+rng()*(1024-70);
  return {u0:x0/2048,u1:(x0+50)/2048, v0:1-2042/2048, v1:1-1798/2048};
}

// ---- distant shelf strip texture: 4 rows of painted book rows ----
const stripTex=canvasTex(1024,1024,(ctx)=>{
  const rng=mulberry32(hash(202));
  ctx.fillStyle='#150f0a'; ctx.fillRect(0,0,1024,1024);
  for(let row=0;row<4;row++){
    const y1=(row+1)*256-2;         // shelf line (bottom of row)
    let x=0;
    while(x<1024){
      if(rng()<0.05){ x+=3+rng()*14; continue; }
      const w=5+rng()*rng()*12;
      const h=130+rng()*100;
      const c=pick(rng,PAL);
      ctx.fillStyle=css(c); ctx.fillRect(x,y1-h,w,h);
      ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(x+w-1,y1-h,1,h);
      ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(x,y1-h,1,h);
      if(rng()<0.4){ ctx.fillStyle='rgba(201,166,88,0.4)'; ctx.fillRect(x+1,y1-h+4+rng()*10,w-2,1.5); }
      if(rng()<0.3){ ctx.fillStyle='rgba(201,166,88,0.3)'; ctx.fillRect(x+1,y1-14-rng()*10,w-2,1.5); }
      ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(x,y1-h,w,2);
      x+=w+0.5;
    }
    // soft interior shadow above the books
    const g=ctx.createLinearGradient(0,(row)*256,0,(row)*256+110);
    g.addColorStop(0,'rgba(0,0,0,0.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,row*256,1024,110);
  }
},{repeat:true});

// ---- wood grain (near-white base; tinted per board by vertex colour) ----
const grainTex=canvasTex(256,256,(ctx)=>{
  const rng=mulberry32(hash(303));
  ctx.fillStyle='#f1ede6'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){
    ctx.fillStyle=`rgba(70,45,25,${0.03+rng()*0.09})`;
    const x=rng()*256; ctx.fillRect(x,0,0.5+rng()*3.5,256);
  }
  for(let i=0;i<10;i++){
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect(rng()*256,0,1+rng()*2,256);
  }
},{repeat:true});

// ---- floor parquet ----
const floorTex=canvasTex(512,512,(ctx)=>{
  const rng=mulberry32(hash(404));
  ctx.fillStyle='#84633f'; ctx.fillRect(0,0,512,512);
  for(let r=0;r<18;r++){
    const y=r*28.5; let x=-(rng()*120);
    while(x<512){
      const w=90+rng()*90;
      const f=0.9+rng()*0.2;
      ctx.fillStyle=css(shade([131,99,64],f));
      ctx.fillRect(x,y,w-1.5,27);
      ctx.fillStyle='rgba(80,55,30,0.35)'; ctx.fillRect(x+w-1.5,y,1.5,27);
      for(let i=0;i<5;i++){
        ctx.fillStyle=`rgba(90,60,30,${0.04+rng()*0.06})`;
        ctx.fillRect(x+rng()*w,y+rng()*27,20+rng()*50,1);
      }
      x+=w;
    }
    ctx.fillStyle='rgba(80,55,30,0.4)'; ctx.fillRect(0,y+27,512,1.5);
  }
},{repeat:true});

// ---- upper wall module (one bay: pilasters, arch, oculus ring, friezes) ----
const wallTex=canvasTex(1024,1024,(ctx,W,H)=>{
  const MH=WALL_Y1-WALL_Y0;              // 5.6 m
  const pxX=W/BAYW, pxY=H/MH;
  const X=m=>m*pxX, Y=m=>H-m*pxY;        // m measured up from band bottom
  // background: brighter toward skylight
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#f1e9d7'); bg.addColorStop(1,'#e5d9bd');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // faint masonry joints
  ctx.fillStyle='rgba(120,102,72,0.06)';
  for(let m=1.3;m<MH;m+=1.15) ctx.fillRect(0,Y(m),W,2);
  // entablature band above the books
  ctx.fillStyle='#e0d2b3'; ctx.fillRect(0,Y(0.52),W,H-Y(0.52));
  ctx.fillStyle='rgba(255,255,250,0.5)'; ctx.fillRect(0,Y(0.52),W,3);
  ctx.fillStyle='rgba(110,92,62,0.35)'; ctx.fillRect(0,Y(0.13),W,2);
  for(let m=0.06;m<BAYW;m+=0.19){        // dentils
    ctx.fillStyle='rgba(120,100,70,0.3)';
    ctx.fillRect(X(m),Y(0.34),X(0.09)-X(0),Y(0.22)-Y(0.34));
  }
  // top frieze under the cornice
  ctx.fillStyle='#e7dabb'; ctx.fillRect(0,0,W,Y(5.28));
  ctx.fillStyle='rgba(110,92,62,0.3)'; ctx.fillRect(0,Y(5.28),W,2);
  for(let m=0.1;m<BAYW;m+=0.24){
    ctx.fillStyle='rgba(125,105,72,0.28)';
    ctx.fillRect(X(m),Y(5.52),X(0.11)-X(0),Y(5.4)-Y(5.52));
  }
  // pilaster strips at bay edges
  for(const px of [0, BAYW-0.46]){
    const g=ctx.createLinearGradient(X(px),0,X(px+0.46),0);
    g.addColorStop(0,'#d6c8a6'); g.addColorStop(0.5,'#e3d6b7'); g.addColorStop(1,'#cfc09d');
    ctx.fillStyle=g; ctx.fillRect(X(px),Y(5.28),X(0.46)-X(0),Y(0.52)-Y(5.28));
    ctx.fillStyle='rgba(100,84,56,0.4)';
    ctx.fillRect(X(px+0.05),Y(5.28),2,Y(0.52)-Y(5.28));
    ctx.fillRect(X(px+0.4),Y(5.28),2,Y(0.52)-Y(5.28));
    // capital block
    ctx.fillStyle='#d9caa7'; ctx.fillRect(X(px-0.04),Y(5.28),X(0.54)-X(0),Y(4.92)-Y(5.28));
    ctx.fillStyle='rgba(100,84,56,0.35)'; ctx.fillRect(X(px-0.04),Y(4.92),X(0.54)-X(0),2);
  }
  // arch
  const cx=X(BAYW/2), springM=0.55, sy=Y(springM);
  const arch=(rM,wPx,col)=>{
    ctx.strokeStyle=col; ctx.lineWidth=wPx;
    ctx.beginPath();
    ctx.ellipse(cx,sy,rM*pxX,rM*pxY,0,Math.PI,Math.PI*2,false);
    ctx.stroke();
  };
  // lunette fill (recessed, faintly cool wash)
  ctx.beginPath();

  // faint painted glazing bars inside lunette
  ctx.save(); ctx.clip();
  ctx.strokeStyle='rgba(105,95,75,0.28)'; ctx.lineWidth=2.5;
  for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(cx+i*0.62*pxX,sy); ctx.lineTo(cx+i*0.62*pxX,sy-2.5*pxY); ctx.stroke(); }
  for(const rr of [0.8,1.6]){ ctx.beginPath(); ctx.ellipse(cx,sy,rr*pxX,rr*pxY,0,Math.PI,Math.PI*2,false); ctx.stroke(); }

  // arch mouldings
  arch(2.72,12,'#c7b795');
  arch(2.6,10,'#f3ecdb');
  arch(2.49,7,'#c9ba99');
  arch(2.44,3,'rgba(190,158,90,0.5)');
  // spandrel sprigs (restrained botanical curls)
  ctx.strokeStyle='rgba(178,150,84,0.32)'; ctx.lineWidth=3; ctx.lineCap='round';
  for(const sgn of [-1,1]){

  const ocy=Y(4.35);
  ctx.fillStyle='#68604f';
  ctx.beginPath(); ctx.ellipse(cx,ocy,1.05*pxX,1.05*pxY,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#d8cba9'; ctx.lineWidth=14;
  ctx.beginPath(); ctx.ellipse(cx,ocy,1.16*pxX,1.16*pxY,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#b5a681'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.ellipse(cx,ocy,1.06*pxX,1.06*pxY,0,0,Math.PI*2); ctx.stroke();

// ---------- mesh builder ----------
class MB{
  constructor(){ this.p=[]; this.n=[]; this.u=[]; this.c=[]; this.i=[]; this.v=0; }
  quad(pts,nrm,uvs,cols){
    const {p,n,u,c,i}=this;
    for(let k=0;k<4;k++){
      p.push(pts[k][0],pts[k][1],pts[k][2]);
      n.push(nrm[0],nrm[1],nrm[2]);
      u.push(uvs[k*2],uvs[k*2+1]);
      const cc=cols.length===3?cols:cols[k];
      c.push(cc[0],cc[1],cc[2]);
    }
    i.push(this.v,this.v+2,this.v+1, this.v,this.v+3,this.v+2);
    this.v+=4;
  }
  // axis-aligned-in-frame box; axes are THREE.Vector3 (unit)
  box(cx,cy,cz, ux,uy,uz, hx,hy,hz, col, uvScale){
    const s=uvScale||0.5;
    const ax=[ux,uy,uz], hd=[hx,hy,hz];
    const P=(sx,sy,sz)=>[
      cx+ux.x*sx*hx+uy.x*sy*hy+uz.x*sz*hz,
      cy+ux.y*sx*hx+uy.y*sy*hy+uz.y*sz*hz,
      cz+ux.z*sx*hx+uy.z*sy*hy+uz.z*sz*hz];
    const faces=[
      [2,+1,0,1],[2,-1,0,1],  // +n,-n  (tangents x,y)
      [0,+1,2,1],[0,-1,2,1],  // +u,-u
      [1,+1,0,2],[1,-1,0,2],  // +y,-y
    ];
    for(const [axI,sgn,tA,tB] of faces){
      const nvec=ax[axI]; const nx=nvec.x*sgn, ny=nvec.y*sgn, nz=nvec.z*sgn;
      const s3=[0,0,0]; s3[axI]=sgn;
      const mk=(a,b)=>{ const t=[0,0,0]; t[axI]=sgn; t[tA]=a; t[tB]=b; return P(t[0],t[1],t[2]); };
      let pts;
      if(sgn>0) pts=[mk(-1,-1),mk(1,-1),mk(1,1),mk(-1,1)];
      else      pts=[mk(1,-1),mk(-1,-1),mk(-1,1),mk(1,1)];
      const w=hd[tA]/s, h=hd[tB]/s;
      this.quad(pts,[nx,ny,nz],[0,0,w,0,w,h,0,h],col);
    }
  }
  geom(){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));
    g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));
    g.setIndex(this.i.length>65000?new THREE.Uint32BufferAttribute(this.i,1):new THREE.Uint16BufferAttribute(this.i,1));
    return g;
  }
}

// ---------- ribbon builder (closed loops around the oval) ----------
function ribbon(fA,fB,segs,uRep,flip,mat){
  const pos=[],nor=[],uv=[],idx=[];
  const a=new THREE.Vector3(),b=new THREE.Vector3(),a2=new THREE.Vector3(),a0=new THREE.Vector3();
  const tan=new THREE.Vector3(),span=new THREE.Vector3(),nrm=new THREE.Vector3();
  for(let i=0;i<=segs;i++){
    const k=i/segs;
    fA(k,a); fB(k,b);
    fA((k+0.002)%1,a2); fA((k+0.998)%1,a0);
    tan.subVectors(a2,a0).normalize();
    span.subVectors(b,a);
    nrm.crossVectors(span,tan).normalize();
    if(flip) nrm.negate();
    pos.push(a.x,a.y,a.z, b.x,b.y,b.z);
    nor.push(nrm.x,nrm.y,nrm.z, nrm.x,nrm.y,nrm.z);
    uv.push(k*uRep,0, k*uRep,1);
  }
  for(let i=0;i<segs;i++){
    const o=i*2;
    idx.push(o,o+3,o+2, o,o+1,o+3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(new THREE.Uint32BufferAttribute(idx,1));
  return new THREE.Mesh(g,mat);
}

function caseFrame(sA,sB,y){
  const pa=ptAt(sA,OFF_FACE,y), pb=ptAt(sB,OFF_FACE,y);
  const u=new V().subVectors(pb,pa); const len=u.length(); u.divideScalar(len);
  const n=new V(u.z,0,-u.x); // inward
  return {org:pa,u,n,len,yv:new V(0,1,0)};
}
function woodCol(rng,f){ const b=0.30+rng()*0.05;   // warm brown, matte
  return [b*f*1.02, b*f*0.72, b*f*0.47]; }

function buildCase(F, rng, plinth, pitches, corniceH, dark){
  const {org,u,n,len,yv}=F;
  const H=plinth+pitches.reduce((a,b)=>a+b,0)+corniceH;
  const at=(lx,ly,ln)=>[org.x+u.x*lx+n.x*ln, org.y+ly, org.z+u.z*lx+n.z*ln];
  const box=(lx,ly,ln,hx,hy,hz,col)=>{ const c=at(lx,ly,ln); mbWood.box(c[0],c[1],c[2],u,yv,n,hx,hy,hz,col); };
  const base=woodCol(rng,1);
  // uprights
  box(0.028,H/2,-0.21, 0.028,H/2,0.23, base);
  box(len-0.028,H/2,-0.21, 0.028,H/2,0.23, base);
  // back panel (very dark)
  box(len/2,H/2,-0.42, len/2,H/2,0.015, [0.055,0.04,0.028]);
  // plinth
  box(len/2,plinth/2,-0.185, len/2,plinth/2,0.245, woodCol(rng,0.8));
  // shelf boards
  let yy=plinth;
  for(let r=0;r<pitches.length;r++){
    yy+=pitches[r];
    if(r<pitches.length-1) box(len/2,yy-BOARD/2,-0.185, len/2,BOARD/2,0.25, woodCol(rng,0.9));
  }
  // cornice
  box(len/2,H-corniceH/2,-0.19, len/2,corniceH/2,0.25, woodCol(rng,0.75));
  return H;
}

function emitBook(cx0,rowY,w,h,d,push,lean,F,rng){
  const {org,u,n}=F;
  const cos=Math.cos(lean), sin=Math.sin(lean);
  // frame tilted about n
  const bux=u.x*cos, buy=sin, buz=u.z*cos;
  const byx=-u.x*sin, byy=cos, byz=-u.z*sin;
  const hw=w/2, hh=h/2, hd=d/2;
  const fOff=push, bOff=push-d;
  const cxx=org.x+u.x*cx0, cyy=org.y+rowY, czz=org.z+u.z*cx0;
  // center = base + by*hh + n*(fOff-hd)
  const CX=cxx+byx*hh+n.x*(fOff-hd), CY=cyy+byy*hh, CZ=czz+byz*hh+n.z*(fOff-hd);
  const P=(sx,sy,sz)=>[
    CX+bux*sx*hw+byx*sy*hh+n.x*sz*hd,
    CY+buy*sx*hw+byy*sy*hh,
    CZ+buz*sx*hw+byz*sy*hh+n.z*sz*hd];
  const des=DESIGNS[(rng()*DESIGNS.length)|0];
  const jit=0.9+rng()*0.18;
  const spineC=[jit,jit*(0.97+rng()*0.05),jit*(0.94+rng()*0.06)];
  const cc=des.col;
  const clothF=[cc[0]*1.02,cc[1]*1.02,cc[2]*1.02];
  const clothB=[cc[0]*0.42,cc[1]*0.42,cc[2]*0.42];
  const pap=clothUV(rng), top=paperUV(rng);
  const papF=[1,0.97,0.9], papB=[0.5,0.47,0.42];
  // FRONT (spine) — u mirrored so lettering reads correctly from the room
  mbBooks.quad([P(-1,-1,1),P(1,-1,1),P(1,1,1),P(-1,1,1)],
    [n.x,0,n.z],
    [des.u1,des.v0, des.u0,des.v0, des.u0,des.v1, des.u1,des.v1],
    spineC);
  // BACK (against the shelf, seen only through grazing gaps)
  mbBooks.quad([P(1,-1,-1),P(-1,-1,-1),P(-1,1,-1),P(1,1,-1)],
    [-n.x,0,-n.z],
    [pap.u0,pap.v0, pap.u1,pap.v0, pap.u1,pap.v1, pap.u0,pap.v1],
    clothB);
  // TOP (paper)
  mbBooks.quad([P(-1,1,1),P(1,1,1),P(1,1,-1),P(-1,1,-1)],
    [byx,byy,byz],
    [top.u0,top.v0, top.u1,top.v0, top.u1,top.v1, top.u0,top.v1],
    [papF,papF,papB,papB]);
  // LEFT
  mbBooks.quad([P(-1,-1,-1),P(-1,-1,1),P(-1,1,1),P(-1,1,-1)],
    [-bux,-buy,-buz],
    [pap.u0,pap.v0, pap.u1,pap.v0, pap.u1,pap.v1, pap.u0,pap.v1],
    [clothB,clothF,clothF,clothB]);
  // RIGHT
  mbBooks.quad([P(1,-1,1),P(1,-1,-1),P(1,1,-1),P(1,1,1)],
    [bux,buy,buz],
    [pap.u0,pap.v0, pap.u1,pap.v0, pap.u1,pap.v1, pap.u0,pap.v1],
    [clothF,clothB,clothB,clothF]);
  // BOTTOM (dark)
  const dk=[cc[0]*0.2,cc[1]*0.2,cc[2]*0.2];
  mbBooks.quad([P(-1,-1,-1),P(1,-1,-1),P(1,-1,1),P(-1,-1,1)],
    [-byx,-byy,-byz],
    [pap.u0,pap.v0, pap.u1,pap.v0, pap.u1,pap.v1, pap.u0,pap.v1],
    dk);
}

function fillRow(F,rowY,clear,depthBase,rng){
  let x=0.06; const end=F.len-0.06;
  while(true){
    const w=0.024+rng()*rng()*0.05;
    if(x+w>end) break;
    if(rng()<0.045){ x+=0.03+rng()*0.1; continue; }
    const h=Math.max(0.13, clear*(0.6+rng()*0.36));
    const d=depthBase*(0.75+rng()*0.35);
    const push=(rng()<0.05)? 0.008 : -(0.003+rng()*0.014);
    let lean=0;
    if(rng()<0.055){ lean=(rng()-0.5)*0.14; }
    emitBook(x+w/2,rowY,w,h,d,push,lean,F,rng);
    x+=w+0.0018+Math.abs(lean)*h*0.55;
  }
}

const CASES_PER_BAY=4, EDGE=0.5;
for(let bay=0;bay<BAYS;bay++){
  const s0=bay*BAYW;
  // solid wood pilaster panel closing the bay boundary (behind the column pair)
  {
    const rngB=mulberry32(hash(bay,991));
    const Fb=caseFrame(s0-EDGE-0.06, s0+EDGE+0.06, 0);
    const cb=woodCol(rngB,0.82);
    mbWood.box(
      Fb.org.x+Fb.u.x*Fb.len/2+Fb.n.x*(-0.2), 2.26, Fb.org.z+Fb.u.z*Fb.len/2+Fb.n.z*(-0.2),
      Fb.u, Fb.yv, Fb.n, Fb.len/2, 2.26, 0.24, cb);
    for(let lv=0;lv<3;lv++){
      const Fl=caseFrame(s0-EDGE-0.06, s0+EDGE+0.06, LVLS[lv]);
      mbWood.box(
        Fl.org.x+Fl.u.x*Fl.len/2+Fl.n.x*(-0.2), LVLS[lv]+0.99, Fl.org.z+Fl.u.z*Fl.len/2+Fl.n.z*(-0.2),
        Fl.u, Fl.yv, Fl.n, Fl.len/2, 0.99, 0.24, cb);
    }
  }
  const uA=s0+EDGE, uB=s0+BAYW-EDGE;
  const caseW=(uB-uA)/CASES_PER_BAY;
  for(let ci=0;ci<CASES_PER_BAY;ci++){
    const sA=uA+ci*caseW, sB=sA+caseW;
    const isDoor = (bay===ENTR_BAY)&&(ci===1||ci===2);
    // ---- ground level ----
    if(!isDoor){
      const rngC=mulberry32(hash(bay,ci,1));
      const F=caseFrame(sA,sB,0);
      buildCase(F,rngC,G_PLINTH,G_PITCH,G_CORNICE);
      let yy=G_PLINTH;
      for(let r=0;r<G_PITCH.length;r++){
        const rngR=mulberry32(hash(bay,ci,10+r));
        fillRow(F,yy,G_PITCH[r]-BOARD-0.02,0.26,rngR);
        yy+=G_PITCH[r];
      }
    }
    // ---- gallery levels ----
    for(let lv=0;lv<3;lv++){
      const rngC=mulberry32(hash(bay,ci,100+lv));
      const F=caseFrame(sA,sB,LVLS[lv]);
      buildCase(F,rngC,L_PLINTH,L_PITCH,L_BAND);
      let yy=L_PLINTH;
      for(let r=0;r<L_PITCH.length;r++){
        if(lv===0){
          const rngR=mulberry32(hash(bay,ci,200+r));
          fillRow(F,yy,L_PITCH[r]-BOARD-0.02,0.2,rngR);
        }else{
          // painted strip quad
          const variant=(bay*7+ci*3+r+lv)%4;
          const v0=1-(variant+1)*0.25+0.004, v1=1-variant*0.25-0.004;
          const y0=LVLS[lv]+yy+0.004, y1=LVLS[lv]+yy+L_PITCH[r]-BOARD;
          const {org,u,n,len}=F;
          const q=(lx,ly)=>[org.x+u.x*lx+n.x*(-0.02), ly, org.z+u.z*lx+n.z*(-0.02)];
          const su=(sA%L)/4.6;
          mbStrip.quad([q(0.05,y0),q(len-0.05,y0),q(len-0.05,y1),q(0.05,y1)],
            [n.x,0,n.z],
            [su,v0, su+(len-0.1)/4.6,v0, su+(len-0.1)/4.6,v1, su,v1],
            [1,1,1]);
        }
        yy+=L_PITCH[r];
      }
    }
  }
}

{
  const books=new THREE.Mesh(mbBooks.geom(),matBooks); scene.add(books);
  const wood=new THREE.Mesh(mbWood.geom(),matWood); scene.add(wood);
  const strips=new THREE.Mesh(mbStrip.geom(),matStrip); scene.add(strips);
}

// ============================================================
// GALLERIES: walkways, fascias, railings
// ============================================================
const SEGS=768;
// wood fascia bands closing the gap between case tops and next walkway
ribbonAdd(curveFn(0.5,4.33),curveFn(0.5,4.52),1,matWoodPlain);
ribbonAdd(curveFn(0.5,LVLS[0]+L_TOP+L_BAND),curveFn(0.5,LVLS[1]+0.02),1,matWoodPlain);
ribbonAdd(curveFn(0.5,LVLS[1]+L_TOP+L_BAND),curveFn(0.5,LVLS[2]+0.02),1,matWoodPlain);
ribbonAdd(curveFn(0.5,LVLS[2]+L_TOP+L_BAND),curveFn(0.5,WALL_Y0+0.02),1,matWoodPlain);
function ribbonAdd(fa,fb,uRep,mat,flip){ scene.add(ribbon(fa,fb,SEGS,uRep,flip,mat)); }

for(const ly of LVLS){
  // walkway floor (top), underside, inner fascia
  ribbonAdd(curveFn(0.64,ly),curveFn(1.62,ly),16,matWalkTop);
  ribbonAdd(curveFn(0.64,ly-0.06),curveFn(1.62,ly-0.06),16,matWalkDark,true);
  ribbonAdd(curveFn(1.62,ly-0.07),curveFn(1.62,ly+0.02),16,matWalkDark);
  // handrail + mid rails
  class RailCurve extends THREE.Curve{
    constructor(d,y){ super(); this.d=d; this.y=y; }
    getPoint(k,out=new THREE.Vector3()){ return ptAt(k*L,this.d,this.y,out); }
  }
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new RailCurve(1.60,ly+0.96),420,0.024,6,true),matIron));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new RailCurve(1.60,ly+0.62),420,0.011,5,true),matIron));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new RailCurve(1.60,ly+0.3),420,0.011,5,true),matIron));
}
// balusters (all levels, one instanced mesh)
{
  const step=0.18, per=Math.floor(L/step);
  const g=new THREE.BoxGeometry(0.014,0.9,0.014);

// ============================================================
// COLUMNS (paired slender cast iron at bay boundaries)
// ============================================================
{
  const COLH=11.4;
  const shaft=new THREE.CylinderGeometry(0.082,0.096,COLH,10,1);
  const cap1=new THREE.BoxGeometry(0.34,0.1,0.34);
  const cap2=new THREE.BoxGeometry(0.42,0.07,0.42);
  const volute=new THREE.CylinderGeometry(0.075,0.075,0.46,8); volute.rotateZ(Math.PI/2);
  const baseB=new THREE.BoxGeometry(0.3,0.24,0.3);
  const N=BAYS*2;
  const iShaft=new THREE.InstancedMesh(shaft,matIronFlat,N);
  const iCap1=new THREE.InstancedMesh(cap1,matIron,N);
  const iCap2=new THREE.InstancedMesh(cap2,matIron,N);
  const iVol=new THREE.InstancedMesh(volute,matIron,N);
  const iBase=new THREE.InstancedMesh(baseB,matIron,N);
  const m=new THREE.Matrix4(), p=new THREE.Vector3(), q=new THREE.Quaternion(), e=new THREE.Euler();
  let k=0;
  for(let i=0;i<BAYS;i++){
    const sC=i*BAYW;
    for(const off of [-0.27,0.27]){
      const s=sC+off;
      ptAt(s,0.85,0,p);
      const p2=ptAt(s+0.3,0.85,0);
      const heading=Math.atan2(p2.x-p.x,p2.z-p.z);
      e.set(0,heading,0); q.setFromEuler(e);
      m.compose(new THREE.Vector3(p.x,COLH/2,p.z),q,new THREE.Vector3(1,1,1));
      iShaft.setMatrixAt(k,m);
      m.compose(new THREE.Vector3(p.x,COLH-0.32,p.z),q,new THREE.Vector3(1,1,1));
      iCap1.setMatrixAt(k,m);
      m.compose(new THREE.Vector3(p.x,COLH-0.18,p.z),q,new THREE.Vector3(1,1,1));
      iCap2.setMatrixAt(k,m);
      m.compose(new THREE.Vector3(p.x,COLH-0.4,p.z),q,new THREE.Vector3(1,1,1));
      iVol.setMatrixAt(k,m);
      m.compose(new THREE.Vector3(p.x,0.12,p.z),q,new THREE.Vector3(1,1,1));
      iBase.setMatrixAt(k,m);
      k++;
    }
  }
  scene.add(iShaft,iCap1,iCap2,iVol,iBase);
}

// ============================================================
// UPPER WALL, OCULI, CORNICE, CEILING, SKYLIGHT
// ============================================================
ribbonAdd(curveFn(0.35,WALL_Y0),curveFn(0.35,WALL_Y1),BAYS,matWall);
// cornice: underside + fascia
ribbonAdd(curveFn(0.35,WALL_Y1),curveFn(0.95,WALL_Y1),BAYS,matPlasterDim,true);
ribbonAdd(curveFn(0.95,WALL_Y1),curveFn(0.95,17.32),BAYS,matPlaster);
// ceiling cove ring up to skylight rim
{
  const _rp=new THREE.Vector3();
  const rim=(k,out)=>{ const t=tOf(k*L);
    // project toward a pure ellipse rim (15.8 x 10.8) by angle of the wall point
    basePt(t,0,0,_rp); const ang=Math.atan2(-_rp.z/B,_rp.x/A);
    out.set(15.8*Math.cos(ang),17.72,-10.8*Math.sin(ang)); return out; };
  scene.add(ribbon(curveFn(0.95,17.32),rim,SEGS,BAYS,true,matCove));
}
// skylight
{
  const shape=new THREE.Shape();
  shape.absellipse(0,0,15.85,10.85,0,Math.PI*2,false,0);
  const g=new THREE.ShapeGeometry(shape,96);
  const pAttr=g.attributes.position,uAttr=g.attributes.uv;
  for(let i=0;i<pAttr.count;i++)
    uAttr.setXY(i,(pAttr.getX(i)/15.85)*0.5+0.5,(pAttr.getY(i)/10.85)*0.5+0.5);
  g.rotateX(Math.PI/2);
  const mesh=new THREE.Mesh(g,matSky);
  mesh.position.y=17.74;
  scene.add(mesh);
}
// oculi (luminous discs in front of painted surrounds)
{
  const g=new THREE.CircleGeometry(0.98,40);
  for(let i=0;i<BAYS;i++){
    const s=(i+0.5)*BAYW;
    const p=ptAt(s,0.45,WALL_Y0+4.35);
    const pw=ptAt(s,0.0,WALL_Y0+4.35);
    const mesh=new THREE.Mesh(g,matOculus);
    mesh.position.copy(p);
    // face along the wall's inward normal (not toward centre — this is an ellipse)
    mesh.lookAt(2*p.x-pw.x, WALL_Y0+4.35, 2*p.z-pw.z);
    scene.add(mesh);
  }
}

// ============================================================
// ENTRANCE (bay 0 — the one interruption in the shelving)
// ============================================================
{
  const s=ENTR_BAY*BAYW+BAYW/2;
  const p=ptAt(s,OFF_FACE,0);
  const p2=ptAt(s+0.4,OFF_FACE,0);
  const u=new V().subVectors(p2,p).normalize();
  const n=new V(u.z,0,-u.x);
  const grp=new THREE.Group();
  const mb=new MB(); const yv=new V(0,1,0);
  const at=(lx,ly,ln)=>[p.x+u.x*lx+n.x*ln, ly, p.z+u.z*lx+n.z*ln];
  const ivory=[0.88,0.83,0.7];
  // pilasters
  for(const sx of [-1.32,1.32]){
    const c=at(sx,1.95,0.12);
    mb.box(c[0],c[1],c[2],u,yv,n,0.24,1.95,0.34,ivory,1);
  }
  // lintel + entablature (fits under the first gallery)
  let c=at(0,4.02,0.12);
  mb.box(c[0],c[1],c[2],u,yv,n,1.62,0.16,0.38,ivory,1);
  c=at(0,4.32,0.12);
  mb.box(c[0],c[1],c[2],u,yv,n,1.78,0.15,0.42,[0.84,0.78,0.64],1);
  // door leaves (dark wood, recessed, slightly ajar)
  c=at(-0.55,1.8,-0.62);
  mb.box(c[0],c[1],c[2],u,yv,n,0.54,1.8,0.04,[0.16,0.11,0.07],1);
  c=at(0.58,1.8,-0.5);
  mb.box(c[0],c[1],c[2],u,yv,n,0.54,1.8,0.04,[0.13,0.09,0.06],1);
  const mesh=new THREE.Mesh(mb.geom(),matWood);
  grp.add(mesh);
  // dark recess interior
  const voidM=new THREE.Mesh(new THREE.BoxGeometry(2.7,3.9,1.7),matDarkVoid);
  const vc=ptAt(s,OFF_FACE-0.8,0);
  voidM.position.set(vc.x,1.94,vc.z);
  voidM.rotation.y=Math.atan2(n.x,n.z);
  grp.add(voidM);
  scene.add(grp);
}

// ============================================================
// READING TABLES, CHAIRS, LAMPS (open centre, long axis)
// ============================================================
const lampGlows=[];
{
  const mb=new MB();
  const ux=new V(1,0,0), uy=new V(0,1,0), uz=new V(0,0,1);
  const tone=(f)=>[0.2*f,0.135*f,0.085*f];
  const TABLES=[];
  for(const z of [-3.2,3.2]) for(const x of [-8.7,0,8.7]) TABLES.push([x,z]);
  for(const [tx,tz] of TABLES){
    const TL=7.4, TW2=1.5;
    // top
    mb.box(tx,0.775,tz, ux,uy,uz, TL/2,0.03,TW2/2, tone(1.15), 1);
    // aprons
    mb.box(tx,0.66,tz-TW2/2+0.05, ux,uy,uz, TL/2-0.1,0.08,0.02, tone(0.9),1);
    mb.box(tx,0.66,tz+TW2/2-0.05, ux,uy,uz, TL/2-0.1,0.08,0.02, tone(0.9),1);
    // legs
    for(const lx of [-TL/2+0.18,0,TL/2-0.18]) for(const lz of [-TW2/2+0.12,TW2/2-0.12])
      mb.box(tx+lx,0.375,tz+lz, ux,uy,uz, 0.05,0.375,0.05, tone(0.8),1);
    // central divider + lamp rail
    mb.box(tx,0.92,tz, ux,uy,uz, TL/2-0.15,0.13,0.025, tone(0.85),1);
    // lamps
    for(let li=0;li<4;li++){
      const lx=tx-TL/2+1.05+li*(TL-2.1)/3;
      mb.box(lx,1.03,tz, ux,uy,uz, 0.016,0.12,0.016, [0.12,0.1,0.07],1);
      mb.box(lx,1.17,tz, ux,uy,uz, 0.23,0.06,0.105, [0.075,0.115,0.08],1);
      const glow=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.3),matGlow);
      glow.rotation.x=-Math.PI/2;
      glow.position.set(lx,1.115,tz);
      lampGlows.push(glow);
      scene.add(glow);
    }
  }
  scene.add(new THREE.Mesh(mb.geom(),matWood));
  // chairs (instanced)
  const cb=new MB();
  cb.box(0,0.45,0, ux,uy,uz, 0.21,0.02,0.2, tone(1),1);
  for(const lx of [-0.17,0.17]) for(const lz of [-0.16,0.16])
    cb.box(lx,0.225,lz, ux,uy,uz, 0.018,0.225,0.018, tone(0.85),1);
  for(const lx of [-0.17,0.17])
    cb.box(lx,0.7,-0.18, ux,uy,uz, 0.016,0.24,0.016, tone(0.85),1);
  cb.box(0,0.9,-0.18, ux,uy,uz, 0.2,0.07,0.014, tone(0.95),1);
  const chairGeom=cb.geom();
  const rng=mulberry32(hash(777));
  const mats=[];
  for(const [tx,tz] of TABLES){
    for(let ci=0;ci<5;ci++){
      const cx=tx-2.9+ci*1.45;
      for(const side of [-1,1]){
        if(rng()<0.12) continue;
        const cz=tz+side*(1.05+rng()*0.18);
        const ry=(side>0?Math.PI:0)+(rng()-0.5)*0.25;
        mats.push([cx+(rng()-0.5)*0.15,cz,ry]);
      }
    }
  }
  const inst=new THREE.InstancedMesh(chairGeom,matWood,mats.length);
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),sc=new THREE.Vector3(1,1,1);
  mats.forEach((a,i)=>{
    e.set(0,a[2],0); q.setFromEuler(e);
    m.compose(new THREE.Vector3(a[0],0,a[1]),q,sc);
    inst.setMatrixAt(i,m);
  });
  scene.add(inst);
  // soft blobs under tables
  for(const [tx,tz] of TABLES){
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(8.6,2.6),matBlob);
    sh.rotation.x=-Math.PI/2; sh.position.set(tx,0.012,tz);
    sh.material=matBlob;
    scene.add(sh);
  }
}

ribbonAdd(curveFn(0.56,0.015),curveFn(1.3,0.015),1,matShadow);

for(const z of [-3.2,3.2]) for(const x of [-8.7,0,8.7]){

// ============================================================
// CONTROLS + CAMERA
// ============================================================
let sPos=BAYW*1.6, vel=0, targetV=0;
let yawOff=0, yawTgt=0, pitchOff=0, pitchTgt=0;
const YAW_BIAS=0.21, PITCH_BASE=0.05;
const keys={};
let interacted=false;
function interact(){ if(!interacted){ interacted=true; document.getElementById('hint').classList.add('faded'); } }

addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code)){
    e.preventDefault(); keys[e.code]=true; interact();
  }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('wheel',e=>{
  e.preventDefault();
  vel=THREE.MathUtils.clamp(vel+e.deltaY*0.004,-2.8,2.8);
  interact();
},{passive:false});
addEventListener('pointermove',e=>{
  const nx=(e.clientX/innerWidth)*2-1;
  const ny=(e.clientY/innerHeight)*2-1;
  yawTgt = nx>0 ? nx*0.5 : nx*0.85;
  pitchTgt = ny<0 ? -ny*0.6 : -ny*0.3;
});
// simple touch: vertical drag walks, horizontal drag looks
let touchY=null,touchX=null;
addEventListener('touchstart',e=>{ touchY=e.touches[0].clientY; touchX=e.touches[0].clientX; interact(); },{passive:true});
addEventListener('touchmove',e=>{
  const t=e.touches[0];
  vel=THREE.MathUtils.clamp(vel+(touchY-t.clientY)*0.012,-2.4,2.4);
  yawTgt=THREE.MathUtils.clamp(yawTgt+(t.clientX-touchX)*0.004,-0.85,0.5);
  touchY=t.clientY; touchX=t.clientX;
},{passive:true});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const _p=new THREE.Vector3(), _f=new THREE.Vector3(), _look=new THREE.Vector3();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  const fwd=keys['ArrowUp']||keys['KeyW'], back=keys['ArrowDown']||keys['KeyS'];
  targetV = fwd? 1.45 : back? -1.45 : 0;
  const rate=(fwd||back)? 2.3 : 0.55;
  vel += (targetV-vel)*(1-Math.exp(-dt*rate));
  sPos=((sPos+vel*dt)%L+L)%L;

  ptAt(sPos,OFF_PATH,EYE,_p);
  ptAt(sPos+0.6,OFF_PATH,EYE,_f);
  const heading=Math.atan2(_f.x-_p.x,_f.z-_p.z);

  yawOff += (yawTgt-yawOff)*(1-Math.exp(-dt*4.2));
  pitchOff += (pitchTgt-pitchOff)*(1-Math.exp(-dt*4.2));
  const H=heading-(YAW_BIAS+yawOff);
  const P=THREE.MathUtils.clamp(PITCH_BASE+pitchOff,-0.32,0.72);
  _look.set(Math.sin(H)*Math.cos(P), Math.sin(P), Math.cos(H)*Math.cos(P));

  camera.position.copy(_p);
  camera.lookAt(_p.x+_look.x,_p.y+_look.y,_p.z+_look.z);
  renderer.render(scene,camera);
});
